<div class="mat-elevation-z8">
  <h1>Manage Users</h1>
  <!-- <button mat-button color="primary" routerLink="/admin/categories/add">Add Category</button> -->
  <table mat-table [dataSource]="dataSource" class="mat-table" class="w-[100%]">

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef> Phone no. </th>
      <td mat-cell *matCellDef="let element"> {{element.phone}} </td>
    </ng-container>

<!-- Address Column -->
<ng-container matColumnDef="address">
    <th mat-header-cell *matHeaderCellDef> Address </th>
    <td mat-cell *matCellDef="let element"> {{element.address?.country}} </td>
  </ng-container>

  <!-- Address Column -->
<ng-container matColumnDef="isActive">
    <th mat-header-cell *matHeaderCellDef> Active </th>
    <td mat-cell *matCellDef="let element"> {{element.isActive}} </td>
  </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button mat-button color="accent" [routerLink]="'/admin/categories/'+element._id" >Edit</button>
        <button mat-button color="warn"  (click)="delete(element._id)">Delete</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons>
  </mat-paginator>
</div>
