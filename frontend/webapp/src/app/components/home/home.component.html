
<div>
  
    <div>
        <section class="bg-blue-50 py-12 px-6 md:px-16 flex flex-col md:flex-row items-center justify-between gap-8">
            <!-- Left Text Content -->
            <div class="flex-1 text-center md:text-left">
              <h1 class="lg:text-7xl md:text-5xl font-bold text-blue-700 mb-4">
                Welcome {{user?.name}}!
              </h1>
              <p class="text-xl">– Your One-Stop Destination for Inventory Needs!</p>
              <p class="text-gray-700 text-lg md:text-xl mb-6">
                Find and order everything you need – fast, easy, and reliable.
              </p>
              <a
                routerLink="/productlist"
                class="inline-block bg-blue-600 text-white px-6 py-3 rounded-xl shadow hover:bg-blue-700 transition"
              >
                Browse Inventory
              </a>
            </div>
          
            <!-- Right Image -->
            <div class="flex-1">
              <img
                src="assets/download-removebg-preview.png"
                alt="Inventory Illustration"
                class="w-full max-w-md mx-auto md:mx-0"
              />
            </div>
          </section>
     </div>
     <section class="py-12 bg-gray-50">
      <div class="max-w-6xl mx-auto px-4">
    
        <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-8 text-center">
          Browse Categories
        </h2>
    
        <div class="flex flex-wrap justify-center gap-6">
          <div
            *ngFor="let category of categories"
            (click)="selectCategory(category._id)"
            class="w-[160px] h-[80px]
                   flex items-center justify-center
                   bg-white rounded-2xl border border-gray-100
                   shadow-sm hover:shadow-md
                   cursor-pointer transition-all duration-200
                   hover:-translate-y-1"
          >
            <h3 class="text-base font-semibold text-gray-700 text-center">
              {{ category.name }}
            </h3>
          </div>
        </div>
    
      </div>
    </section>
    
    
    
    <div>
        <section>
            <app-product-grid [categoryId]="selectedCategoryId"></app-product-grid>
        </section>
    </div>
</div>
<!-- [routerLink]="['/productlist']"
    [queryParams]="{ categoryId: category._id }" -->
